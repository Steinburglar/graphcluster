# Runnable debug config for the battery XYZ dataset.
#
# This is meant to exercise the current end-to-end path:
# read frames -> build cutoff graph -> Leiden partition -> track
# -> stream transient frame bundles into artifact writers.

input:
  backend: ase
  format: xyz
  trajectory: /n/netscratch/kozinsky_lab/Lab/lsteinberger/datasets/Battery/training_data/data/Dec23-complete-dataset_dft.xyz

frames:
  start: 0
  stop: 5
  stride: 1

graph:
  source: trajectory
  cutoff: 3.5
  kernel:
    name: gaussian
    sigma: 1.0
  directed: false

partition:
  algorithm: leiden
  objective: modularity
  resolution: 0.05
  warm_start: true

visualization:
  enabled: true
  backend: ase
  mode: traj
  write_batch_size: 1
  output_path: /n/home12/lsteinberger/graphcluster/outputs/battery_debug/visualization.extxyz

analysis:
  enabled: true
  write_batch_size: 1
  output_path: /n/home12/lsteinberger/graphcluster/outputs/battery_debug/cluster_lifecycle_report.jsonl

output:
  directory: /n/home12/lsteinberger/graphcluster/outputs/battery_debug
  write_csv: false
  write_vmd: false
