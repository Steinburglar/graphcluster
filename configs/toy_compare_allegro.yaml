# Matched comparison run for the toy dataset using exported Allegro edge
# energies. This config first annotates the raw trajectory with edge energies,
# then runs the normal clustering pipeline on the derived ASE trajectory.

input:
  backend: ase
  trajectory: /n/home12/lsteinberger/graphcluster/tests/data/Ga80Pt20_129_773K_ss_1.all.bin
  cell_origin_reference_trajectory: /n/home12/lsteinberger/graphcluster/tests/data/Ga80Pt20_129_773K_ss_1.all.bin
  cell_origin_reference_format: lammps-dump-binary
  type_map:
    1: Ga
    2: Pt

frames:
  start: 0
  stop: 5
  stride: 1

graph:
  source: allegro
  directed: false

allegro:
  mode: annotate_always
  compiled_model: /n/home12/lsteinberger/models/compiled/Allegro-OAM-L-0.1.cpu.energies.nequip.pt2
  annotated_trajectory_path: /n/home12/lsteinberger/graphcluster/outputs/toy_compare_allegro/allegro_edges.traj
  device: cpu
  raw_type_map:
    1: Ga
    2: Pt
  species_to_model_type_map: null

partition:
  algorithm: leiden
  objective: cpm
  resolution: 10.0
  warm_start: true

visualization:
  enabled: true
  backend: ase
  mode: traj
  write_batch_size: 1
  output_path: /n/home12/lsteinberger/graphcluster/outputs/toy_compare_allegro/visualization.extxyz

analysis:
  enabled: true
  write_batch_size: 1
  output_path: /n/home12/lsteinberger/graphcluster/outputs/toy_compare_allegro/cluster_lifecycle_report.jsonl

output:
  directory: /n/home12/lsteinberger/graphcluster/outputs/toy_compare_allegro
  write_csv: false
  write_vmd: false
