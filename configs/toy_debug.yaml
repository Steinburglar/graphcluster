# Runnable debug config for the repository toy dataset.
#
# This is meant to exercise the current end-to-end path:
# read frames -> build cutoff graph -> Leiden partition -> track
# -> stream transient frame bundles into artifact writers.

input:
  backend: ase
  trajectory: /n/home12/lsteinberger/graphcluster/tests/data/Ga80Pt20_129_773K_ss_1.all.bin
  type_map:
    1: Ga
    2: Pt

frames:
  start: 0
  stop: 5
  stride: 1

graph:
  source: trajectory
  cutoff: 3.5
  kernel: binary
  directed: false

partition:
  algorithm: leiden
  objective: cpm
  resolution: 0.05
  warm_start: true

visualization:
  enabled: true
  backend: ase
  mode: traj
  write_batch_size: 1
  output_path: /n/home12/lsteinberger/graphcluster/outputs/toy_debug/visualization.extxyz

analysis:
  enabled: true
  write_batch_size: 1
  output_path: /n/home12/lsteinberger/graphcluster/outputs/toy_debug/cluster_lifecycle_report.jsonl

output:
  directory: /n/home12/lsteinberger/graphcluster/outputs/toy_debug
  write_csv: false
  write_vmd: false
