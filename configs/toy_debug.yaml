# Runnable debug config for the repository toy dataset.
#
# This is meant to exercise the current scaffold end to end:
# read frames -> build placeholder graph -> partition -> track -> write
# ASE-readable visualization output.

input:
  backend: ase
  trajectory: /n/home12/lsteinberger/graphcluster/tests/data/Ga80Pt20_129_773K_ss_1.all.bin
  type_map:
    1: Ga
    2: Pt

frames:
  start: 0
  stop: 5
  stride: 1

graph:
  source: trajectory
  directed: false

partition:
  algorithm: placeholder
  warm_start: true

visualization:
  enabled: true
  backend: ase
  mode: traj
  output_path: /n/home12/lsteinberger/graphcluster/outputs/toy_debug/visualization.extxyz

output:
  directory: /n/home12/lsteinberger/graphcluster/outputs/toy_debug
  write_csv: false
  write_vmd: false
