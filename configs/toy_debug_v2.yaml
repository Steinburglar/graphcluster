source:
  backend: ase
  format: lammps-dump-binary
  path: tests/data/Ga80Pt20_129_773K_ss_1.all.bin
  type_map:
    1: Ga
    2: Pt

selection:
  start: 0
  stop: 3
  stride: 1

edges:
  kind: binary
  cutoff: 3.5
  directed: false

partition:
  algorithm: leiden
  objective: cpm
  resolution: 0.05
  warm_start: true

tracking:
  enabled: true
  overlap_metric: jaccard
  match_threshold: 0.5

artifacts:
  directory: outputs/toy_debug_v2
  visualization:
    enabled: true
    backend: ase
    mode: traj
    write_batch_size: 10
  lifecycle_report:
    enabled: true
    write_batch_size: 10

profiling:
  enabled: false
