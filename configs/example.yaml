input:
  format: lammps
  topology: path/to/topology.data
  trajectory: path/to/trajectory.dump

frames:
  start: 0
  stop: 10
  stride: 1

graph:
  source: trajectory
  mode: cutoff_distance
  cutoff: 3.5
  kernel: binary
  directed: false

partition:
  algorithm: leiden
  objective: cpm
  resolution: 0.05
  warm_start: true

visualization:
  enabled: true
  backend: ase
  mode: traj
  write_batch_size: 10
  output_path: outputs/example/visualization.extxyz

analysis:
  enabled: true
  write_batch_size: 10
  output_path: outputs/example/cluster_lifecycle_report.jsonl

tracking:
  enabled: true
  overlap_metric: jaccard
  match_threshold: 0.5

output:
  directory: outputs/example
  write_csv: true
  write_vmd: false
