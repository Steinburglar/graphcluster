# Nearby robustness-check run for the toy dataset using a Gaussian graph
# kernel. This nudges the resolution upward relative to the main Gaussian
# comparison without changing the rest of the setup.

input:
  backend: ase
  trajectory: /n/home12/lsteinberger/graphcluster/tests/data/Ga80Pt20_129_773K_ss_1.all.bin
  type_map:
    1: Ga
    2: Pt

frames:
  start: 0
  stop: 5
  stride: 1

graph:
  source: trajectory
  cutoff: 3.5
  kernel:
    name: gaussian
    sigma: 1.0
  directed: false

partition:
  algorithm: leiden
  objective: cpm
  resolution: 0.0005
  warm_start: true

visualization:
  enabled: true
  backend: ase
  mode: traj
  write_batch_size: 1
  output_path: /n/home12/lsteinberger/graphcluster/outputs/toy_compare_gaussian_robust/visualization.extxyz

analysis:
  enabled: true
  write_batch_size: 1
  output_path: /n/home12/lsteinberger/graphcluster/outputs/toy_compare_gaussian_robust/cluster_lifecycle_report.json

output:
  directory: /n/home12/lsteinberger/graphcluster/outputs/toy_compare_gaussian_robust
  write_csv: false
  write_vmd: false
